
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOBBY | Movie Streaming</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;
font-family:Arial,sans-serif}
header{padding:20px 5%;display:flex;
align-items:center;justify-content:space-between;
background:#080808;gap:12px;flex-wrap:wrap}
.logo{color:#e50914;font-size:30px;font-weight:900}
input,select{padding:11px;border-radius:6px;
border:1px solid #444;background:#222;color:white;
max-width:100%}
.hero{padding:40px 5%;background:
linear-gradient(90deg,#151515,#381313,#111)}
.hero h1{font-size:36px;margin-bottom:8px}
button{background:#e50914;color:white;border:0;
padding:12px 18px;border-radius:5px;
font-weight:bold;cursor:pointer}
main{padding:20px 5%}
.movies{display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#202020;border-radius:8px;overflow:hidden}
.poster{height:145px;display:flex;align-items:center;
justify-content:center;font-size:42px;
background:linear-gradient(135deg,#401414,#171717)}
.info{padding:12px}
.info h3{margin:0 0 8px}
small{color:#bbb}
video{width:100%;max-height:65vh;background:black}
#player{margin:24px 0}
footer{text-align:center;color:#aaa;padding:30px}
@media(min-width:650px){
.movies{grid-template-columns:repeat(4,minmax(0,1fr))}
.poster{height:220px}
.hero h1{font-size:48px}
}
</style>
</head>
<body>
<header>
  <div class="logo">HOBBY</div>
  <input id="search" placeholder="Search movies..."
  aria-label="Search movies">
</header>

<section class="hero">
  <small>WELCOME TO HOBBY</small>
  <h1>Your Movie. Your World.</h1>
  <p>Discover your next favorite film.</p>
  <button onclick="document.getElementById('library')
  .scrollIntoView({behavior:'smooth'})">Explore Movies</button>
</section>

<main>
  <h2>Featured Movies</h2>
  <select id="genre" aria-label="Filter genre">
    <option value="all">All genres</option>
    <option value="Action">Action</option>
    <option value="Drama">Drama</option>
    <option value="Comedy">Comedy</option>
  </select>

  <div id="library" class="movies"></div>

  <section id="player">
    <h2 id="now">Choose a movie to watch</h2>
    <video id="video" controls playsinline
    preload="metadata"></video>
    <p id="note">Select a movie from the collection above.</p>
  </section>
</main>

<footer>HOBBY © 2026 · Movies shared with permission</footer>

<script>
const movies = [
  {title:"My First Movie",genre:"Action",
   emoji:"🎬",url:""},
  {title:"Dream Story",genre:"Drama",
   emoji:"🌆",url:""},
  {title:"Funny Days",genre:"Comedy",
   emoji:"😄",url:""},
  {title:"Adventure Time",genre:"Action",
   emoji:"🚀",url:""}
];

const library = document.getElementById("library");
const video = document.getElementById("video");

function render(){
  const q = document.getElementById("search")
    .value.toLowerCase();
  const g = document.getElementById("genre").value;
  library.innerHTML = "";

  movies.filter(m =>
    m.title.toLowerCase().includes(q) &&
    (g === "all" || m.genre === g)
  ).forEach(m => {
    const card = document.createElement("article");
    card.className = "card";

    const poster = document.createElement("div");
    poster.className = "poster";
    poster.textContent = m.emoji;

    const info = document.createElement("div");
    info.className = "info";

    const title = document.createElement("h3");
    title.textContent = m.title;

    const genre = document.createElement("small");
    genre.textContent = m.genre;

    const btn = document.createElement("button");
    btn.textContent = "▶ Play";
    btn.style.marginTop = "12px";
    btn.onclick = () => play(m);

    info.append(title, genre,
      document.createElement("br"), btn);
    card.append(poster, info);
    library.append(card);
  });
}

function play(m){
  if(!m.url){
    document.getElementById("now").textContent = m.title;
    document.getElementById("note").textContent =
      "Wala pang video link. Idagdag muna ang authorized video URL sa code.";
    return;
  }
  video.src = m.url;
  document.getElementById("now").textContent = m.title;
  document.getElementById("note").textContent = "";
  video.play().catch(() => {
    document.getElementById("note").textContent =
      "Pindutin ang Play sa video player.";
  });
}

document.getElementById("search")
  .addEventListener("input",render);
document.getElementById("genre")
  .addEventListener("change",render);
render();
</script>
</body>
  </html>
